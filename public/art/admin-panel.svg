<svg viewBox="0 0 440 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Panel de gestión">
  <defs>
    <linearGradient id="apCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf8"/><stop offset="1" stop-color="#f3e5ea"/>
    </linearGradient>
    <linearGradient id="apBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6d0b2f"/><stop offset="1" stop-color="#a13b60"/>
    </linearGradient>
    <linearGradient id="apGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c69d"/><stop offset="1" stop-color="#c99d61"/>
    </linearGradient>
  </defs>

  <!-- main dashboard card -->
  <rect x="40" y="70" width="330" height="230" rx="20" fill="url(#apCard)"/>
  <rect x="40" y="70" width="330" height="46" rx="20" fill="#530422"/>
  <rect x="40" y="96" width="330" height="20" fill="#530422"/>
  <circle cx="64" cy="93" r="5" fill="#e3c69d"/>
  <circle cx="82" cy="93" r="5" fill="#d7a2b5"/>
  <circle cx="100" cy="93" r="5" fill="#a13b60"/>
  <rect x="150" y="88" width="120" height="10" rx="5" fill="#ffffff" opacity="0.35"/>

  <!-- chart bars -->
  <g>
    <rect x="72" y="210" width="30" height="60" rx="6" fill="url(#apBar)"/>
    <rect x="116" y="180" width="30" height="90" rx="6" fill="url(#apBar)"/>
    <rect x="160" y="200" width="30" height="70" rx="6" fill="url(#apBar)"/>
    <rect x="204" y="160" width="30" height="110" rx="6" fill="url(#apGold)"/>
    <rect x="248" y="192" width="30" height="78" rx="6" fill="url(#apBar)"/>
    <rect x="292" y="150" width="30" height="120" rx="6" fill="url(#apGold)"/>
  </g>
  <!-- trend line -->
  <path d="M72 200 L131 168 L175 186 L219 150 L263 178 L307 140" fill="none" stroke="#530422" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="307" cy="140" r="5" fill="#530422"/>

  <!-- stat tiles -->
  <rect x="40" y="322" width="156" height="96" rx="16" fill="url(#apCard)"/>
  <rect x="214" y="322" width="156" height="96" rx="16" fill="#530422"/>
  <circle cx="70" cy="352" r="16" fill="#f3e5ea"/>
  <path d="M64 352 h12 M70 346 v12" stroke="#6d0b2f" stroke-width="3" stroke-linecap="round"/>
  <rect x="58" y="378" width="90" height="10" rx="5" fill="#6d0b2f"/>
  <rect x="58" y="396" width="60" height="7" rx="3.5" fill="#a13b60" opacity="0.6"/>
  <circle cx="244" cy="352" r="16" fill="rgba(255,255,255,0.14)"/>
  <path d="M238 356 l5 5 9 -11" stroke="#e3c69d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="232" y="378" width="90" height="10" rx="5" fill="#e3c69d"/>
  <rect x="232" y="396" width="60" height="7" rx="3.5" fill="#ffffff" opacity="0.4"/>

  <!-- floating pill -->
  <g transform="translate(330 40)">
    <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#c99d61"/>
    <path d="M-24 0 l6 6 12 -14" stroke="#530422" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="0" y="-4" width="34" height="8" rx="4" fill="#530422"/>
  </g>
</svg>
