<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calidad de laboratorio">
  <defs>
    <linearGradient id="flBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#350015"/><stop offset="1" stop-color="#21000d"/>
    </linearGradient>
    <radialGradient id="flGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c99d61" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c99d61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flJar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#842044"/><stop offset="1" stop-color="#530422"/>
    </linearGradient>
    <linearGradient id="flLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7a2b5"/><stop offset="1" stop-color="#a13b60"/>
    </linearGradient>
  </defs>
  <rect width="480" height="420" rx="26" fill="url(#flBg)"/>
  <circle cx="240" cy="200" r="200" fill="url(#flGlow)"/>

  <!-- grid dots texture -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="60" r="2.5"/><circle cx="110" cy="60" r="2.5"/><circle cx="160" cy="60" r="2.5"/>
    <circle cx="420" cy="80" r="2.5"/><circle cx="420" cy="130" r="2.5"/><circle cx="420" cy="180" r="2.5"/>
    <circle cx="70" cy="360" r="2.5"/><circle cx="120" cy="360" r="2.5"/><circle cx="380" cy="350" r="2.5"/>
  </g>

  <!-- molecule -->
  <g stroke="#e3c69d" stroke-width="3" opacity="0.75">
    <line x1="120" y1="120" x2="180" y2="150"/>
    <line x1="180" y1="150" x2="150" y2="210"/>
    <line x1="180" y1="150" x2="250" y2="130"/>
    <line x1="360" y1="300" x2="410" y2="270"/>
    <line x1="360" y1="300" x2="330" y2="350"/>
  </g>
  <g fill="#e3c69d">
    <circle cx="120" cy="120" r="10"/><circle cx="180" cy="150" r="13"/>
    <circle cx="150" cy="210" r="9"/><circle cx="250" cy="130" r="11"/>
    <circle cx="360" cy="300" r="12"/><circle cx="410" cy="270" r="8"/><circle cx="330" cy="350" r="9"/>
  </g>

  <!-- central jar -->
  <ellipse cx="248" cy="356" rx="96" ry="18" fill="#000000" opacity="0.3"/>
  <path d="M176 190 h144 a16 16 0 0 1 16 16 v120 a26 26 0 0 1 -26 26 h-124 a26 26 0 0 1 -26 -26 v-120 a16 16 0 0 1 16 -16 Z" fill="url(#flJar)"/>
  <path d="M176 272 v54 a26 26 0 0 0 26 26 h124 a26 26 0 0 0 26 -26 v-54 Z" fill="url(#flLiquid)" opacity="0.55"/>
  <rect x="150" y="150" width="196" height="46" rx="14" fill="#e3c69d"/>
  <rect x="150" y="150" width="196" height="14" rx="7" fill="#ffffff" opacity="0.4"/>
  <rect x="188" y="140" width="120" height="16" rx="8" fill="#c99d61"/>
  <circle cx="248" cy="250" r="30" fill="none" stroke="#f3e5ea" stroke-width="4"/>
  <path d="M234 250 l10 10 18 -20" fill="none" stroke="#e3c69d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="196" y="298" width="104" height="9" rx="4.5" fill="#f3e5ea" opacity="0.6"/>

  <!-- quality seal -->
  <g transform="translate(372 118)">
    <circle r="42" fill="#c99d61"/>
    <circle r="42" fill="none" stroke="#fcfaf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle r="30" fill="none" stroke="#530422" stroke-width="2.5"/>
    <path d="M-12 0 l7 8 15 -16" fill="none" stroke="#530422" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="24" font-family="Georgia, serif" font-size="9" fill="#530422" text-anchor="middle" font-weight="bold" letter-spacing="1">CALIDAD</text>
  </g>
</svg>
